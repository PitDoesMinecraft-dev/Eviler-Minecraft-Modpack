# Configuration file

##########################################################################################################
# integrated
#--------------------------------------------------------------------------------------------------------#
# Integrated 1.6.4 world type. Changes only affect newly generated chunks.
##########################################################################################################

integrated {
    # Animal spawn lists. [default: 1.6.4]
    S:animalSpawns=1.6.4

    # Biome layout. 1.6.4 has large continents and the 1.6.4 biomes, 1.7.10 has climate zones and all 1.7.10 biomes. [default: 1.6.4]
    S:biomeLayout=1.6.4

    # Caves. [default: 1.6.4]
    S:caves=1.6.4

    # Enchanted books in generated chests. [default: 1.6.4]
    S:chestBooks=1.6.4

    # Temperatures, snow and ice. 1.7.10 gets colder with height and has no snowy taiga. [default: 1.6.4]
    S:climate=1.6.4

    # Dungeon mobs and loot. [default: 1.6.4]
    S:dungeons=1.6.4

    # Chunk lighting rules. [default: 1.6.4]
    S:lighting=1.6.4

    # Mineshaft frequency. 1.6.4 is more common. [default: 1.6.4]
    S:mineshafts=1.7.10

    # Ravines. [default: 1.6.4]
    S:ravines=1.6.4

    # Biomes that can hold strongholds. [default: 1.6.4]
    S:strongholdBiomes=1.6.4

    # Surface blocks. 1.7.10 has gravel sea floors, deeper sandstone and stone patches on extreme hills. [default: 1.6.4]
    S:surfaceRules=1.6.4

    # Terrain generator. With 1.7.10 only the biome layout, lighting and biome options still apply. [default: 1.6.4]
    S:terrain=1.7.10

    ##########################################################################################################
    # biomes
    #--------------------------------------------------------------------------------------------------------#
    # Options for the 1.6.4 biome layout.
    ##########################################################################################################

    biomes {
        # Biome width compared to vanilla. [default: 1x (Vanilla)]
        S:biomeSize=1x (Vanilla)

        # Warm, temperate, cool, and cold climate zones. [default: false]
        B:climateZones=false

        # Biomes from other mods. [default: true]
        B:moddedBiomes=true

        # Weight of each 1.6.4 biome against modded biome weights. [range: 1 ~ 1000, default: 10]
        I:vanillaBiomeWeight=10
    }

    ##########################################################################################################
    # surface
    #--------------------------------------------------------------------------------------------------------#
    # 1.7.10 surface details, used with 1.6.4 surface rules.
    ##########################################################################################################

    surface {
        # Deeper sandstone under sand. [default: false]
        B:deepSandstone=false

        # Gravel under deep water. [default: false]
        B:gravelOceanFloor=false

        # Bare stone patches on extreme hills. [default: false]
        B:hillsStonePatches=false
    }

    ##########################################################################################################
    # decoration
    #--------------------------------------------------------------------------------------------------------#
    # 1.7.10 plants added to the 1.6.4 biomes.
    ##########################################################################################################

    decoration {
        # 1.7.10 flowers: tulips, orchids, daisies and poppies. [default: true]
        B:flowers=true

        # Lilacs, rose bushes and peonies in forests. [default: true]
        B:forestDoublePlants=true

        # Gravel patches on shores. [default: true]
        B:gravelPatches=true

        # Melons in jungles. [default: true]
        B:jungleMelons=true

        # Extra vines in jungles. [default: true]
        B:jungleVines=true

        # Double tall grass in plains. [default: true]
        B:plainsDoubleGrass=true

        # More grass in swamps. [default: true]
        B:swampGrass=true

        # No sand or gravel patches in swamps. [default: false]
        B:swampNoPatches=false

        # Ferns instead of most grass in taigas. [default: true]
        B:taigaFerns=true

        # Large ferns in taigas. [default: true]
        B:taigaLargeFerns=true

        # Mushrooms in taigas. [default: true]
        B:taigaMushrooms=true
    }

    ##########################################################################################################
    # trees
    #--------------------------------------------------------------------------------------------------------#
    # 1.7.10 tree selection for the 1.6.4 biomes.
    ##########################################################################################################

    trees {
        # 1.7.10 forest trees: no big oaks. [default: false]
        B:forest=false

        # 1.7.10 extreme hills trees: mostly spruce, and trees on the hill edges. [default: false]
        B:hills=false

        # 1.7.10 jungle trees. [default: false]
        B:jungle=false

        # Spruce instead of oak in ice plains and ice mountains. [default: false]
        B:snow=false
    }

}


